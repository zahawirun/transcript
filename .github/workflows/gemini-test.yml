name: Uji Gemini Transcribe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "samples/**"
      - "tests/**"
      - ".github/workflows/gemini-test.yml"

permissions:
  contents: write

concurrency:
  group: gemini-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Pasang ffmpeg dan SDK
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q -U google-genai

      - name: Jalankan uji
        working-directory: repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tests/gemini_test.py

      - name: Simpan hasil ke repo
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Hasil uji Gemini Transcribe [skip ci]" || exit 0
          git pull --rebase origin main
          git push
